<script>
        // Simple map interaction simulation
        const searchInput = document.querySelector('input');
        searchInput.addEventListener('focus', () => {
            const container = searchInput.parentElement;
            container.classList.add('ring-2', 'ring-primary', 'ring-opacity-50');
        });
        searchInput.addEventListener('blur', () => {
            const container = searchInput.parentElement;
            container.classList.remove('ring-2', 'ring-primary', 'ring-opacity-50');
        });

        // Add a subtle drift effect to the map background
        const mapBg = document.querySelector('[data-alt*="map"]');
        let posX = 50;
        let posY = 50;
        
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX / window.innerWidth - 0.5) * 2;
            const moveY = (e.clientY / window.innerHeight - 0.5) * 2;
            mapBg.style.backgroundPosition = `${posX + moveX}% ${posY + moveY}%`;
        });
    </script>
