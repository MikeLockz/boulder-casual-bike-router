<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "tertiary-container": "#8a9995",
                "surface-container-low": "#1a1c1c",
                "primary-fixed-dim": "#59dbbf",
                "on-secondary-fixed-variant": "#004f50",
                "surface-tint": "#59dbbf",
                "on-surface": "#e2e2e2",
                "error-rose": "#FF5C5C",
                "surface": "#121414",
                "on-error": "#690005",
                "secondary": "#8cd3d2",
                "surface-dim": "#121414",
                "surface-bright": "#383939",
                "success-teal": "#00CCAA",
                "background": "#121414",
                "secondary-fixed-dim": "#8cd3d2",
                "on-tertiary-fixed-variant": "#3b4a46",
                "outline-variant": "#3c4945",
                "primary-fixed": "#78f8db",
                "on-error-container": "#ffdad6",
                "tertiary": "#bacac5",
                "tertiary-fixed": "#d6e6e1",
                "secondary-fixed": "#a7efee",
                "mint-glow": "#26FFD4",
                "outline": "#86948f",
                "on-primary-fixed-variant": "#005143",
                "on-tertiary-container": "#23312e",
                "on-secondary-fixed": "#002020",
                "surface-container-high": "#282a2a",
                "on-surface-variant": "#bbcac4",
                "tertiary-fixed-dim": "#bacac5",
                "surface-container-lowest": "#0d0f0f",
                "primary-container": "#00a98f",
                "on-primary-fixed": "#00201a",
                "error-container": "#93000a",
                "on-tertiary-fixed": "#101e1b",
                "surface-variant": "#333535",
                "surface-elevated": "#1C2121",
                "on-primary": "#00382e",
                "on-secondary-container": "#8bd2d2",
                "on-tertiary": "#253330",
                "inverse-on-surface": "#2f3131",
                "secondary-container": "#005c5c",
                "forest-deep": "#0A1F1F",
                "inverse-primary": "#006b5a",
                "primary": "#59dbbf",
                "on-secondary": "#003737",
                "inverse-surface": "#e2e2e2",
                "surface-container-highest": "#333535",
                "surface-container": "#1e2020",
                "error": "#ffb4ab",
                "on-background": "#e2e2e2",
                "on-primary-container": "#00352c"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "gutter": "24px",
                "stack-lg": "48px",
                "container-padding-mobile": "16px",
                "stack-md": "24px",
                "container-padding-desktop": "32px",
                "base-unit": "8px",
                "stack-sm": "12px",
                "margin-mobile": "20px"
            },
            "fontFamily": {
                "body-md": ["Inter"],
                "label-md": ["Inter"],
                "headline-lg": ["Inter"],
                "label-sm": ["Inter"],
                "body-lg": ["Inter"],
                "display-lg": ["Inter"],
                "headline-md": ["Inter"],
                "headline-lg-mobile": ["Inter"],
                "mono-data": ["Inter"]
            },
            "fontSize": {
                "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                "mono-data": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .perspective-map {
            transform: perspective(1000px) rotateX(45deg) scale(1.5);
            transform-origin: center center;
        }
        .nav-glow {
            box-shadow: 0 0 20px rgba(38, 255, 212, 0.4);
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-background text-on-surface overflow-hidden h-screen flex flex-col">
<!-- Active Navigation Canvas -->
<main class="relative flex-grow overflow-hidden">
<!-- 3D Map Base Layer -->
<div class="absolute inset-0 z-0">
<div class="w-full h-[150%] perspective-map bg-forest-deep overflow-hidden">
<img class="w-full h-full object-cover opacity-60 mix-blend-lighten" data-alt="A highly detailed 3D perspective map of a modern city grid in Boulder Colorado. Dark mode aesthetic with mint green neon glowing streets and high contrast highlights. Dark forest green accents." data-location="Boulder, Colorado" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpDm0CkKL6ThgCYGCkWjDX9hFWBNFlDuhAw4vvvoDge6qY-Gv3FjM7XCpI2J6BeEWnDYR_8ktSPcg7Q_gNK1iOxFa2Lf_g0EHZdmTGwQQ8UM-5ED7AFoPdbMslp6xvKNEWZCn2HCf7kmAdK-C4k_fm5UAgmmTsYUJIW7I_agjWOGdUAHwt-ssmUR0Xg8qcd8KEAFwtDZV7hJb9b_345qjfYVgJbDLJmAZLZG2jZPUKoMFx3AZNpr75Pq073PUVkVbRLVEQUr5z3tot"/>
<!-- Overlay for Mint Route Glow -->
<div class="absolute inset-0 bg-gradient-to-t from-primary/10 to-transparent pointer-events-none"></div>
</div>
</div>
<!-- Navigation Arrow (The User) -->
<div class="absolute left-1/2 bottom-1/3 -translate-x-1/2 z-10">
<div class="relative flex items-center justify-center">
<div class="absolute w-24 h-24 bg-primary/20 rounded-full animate-ping"></div>
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center nav-glow border-4 border-surface shadow-lg">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">navigation</span>
</div>
</div>
</div>
<!-- Top Instruction Banner -->
<div class="absolute top-0 left-0 w-full p-4 z-30 pt-safe-area-inset-top">
<div class="bg-forest-deep text-mint-glow border border-primary/20 rounded-xl shadow-2xl overflow-hidden animate-in slide-in-from-top duration-500">
<div class="flex items-center p-base-unit space-x-stack-md px-4 py-6">
<div class="flex-shrink-0 w-16 h-16 bg-primary/20 rounded-lg flex items-center justify-center border border-primary/30">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">turn_right</span>
</div>
<div class="flex-grow">
<p class="font-headline-md text-headline-md leading-tight text-on-surface">Turn Right on 9th St</p>
<p class="font-body-lg text-body-lg text-on-surface-variant">in 500 ft</p>
</div>
</div>
<!-- Progress Line -->
<div class="h-1.5 w-full bg-white/5">
<div class="h-full bg-primary w-[65%] transition-all duration-1000 shadow-[0_0_8px_rgba(89,219,191,0.5)]"></div>
</div>
</div>
</div>
<!-- Secondary Controls (FABs) -->
<div class="absolute right-margin-mobile bottom-40 z-20 flex flex-col space-y-4">
<button class="w-14 h-14 rounded-full bg-surface-container-highest border border-outline-variant shadow-lg flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">add</span>
</button>
<button class="w-14 h-14 rounded-full bg-surface-container-highest border border-outline-variant shadow-lg flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-surface">remove</span>
</button>
<button class="w-14 h-14 rounded-full bg-primary shadow-lg flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined text-on-primary" style="font-variation-settings: 'FILL' 1;">my_location</span>
</button>
</div>
</main>
<!-- Navigation Status Bar (The Bottom Sheet Shell) -->
<footer class="bg-surface-container border-t border-outline-variant shadow-[0_-8px_32px_rgba(0,0,0,0.5)] z-40">
<div class="px-margin-mobile pt-base-unit pb-safe-area-bottom pb-8">
<!-- Pull Handle -->
<div class="w-12 h-1.5 bg-outline-variant/30 rounded-full mx-auto mb-6"></div>
<div class="flex items-center justify-between">
<!-- ETA and Info -->
<div class="flex flex-col">
<div class="flex items-baseline space-x-2">
<span class="font-headline-lg text-headline-lg text-primary">8</span>
<span class="font-body-lg text-body-lg text-primary">min</span>
</div>
<div class="flex items-center text-on-surface-variant space-x-1">
<span class="font-body-md text-body-md">2.1 miles</span>
<span class="text-xs">•</span>
<span class="font-body-md text-body-md">3:42 PM</span>
</div>
</div>
<!-- Traffic Chip -->
<div class="hidden xs:flex bg-secondary-container/30 px-3 py-1 rounded-full items-center space-x-2 border border-secondary/20">
<div class="w-2 h-2 rounded-full bg-success-teal"></div>
<span class="text-secondary font-label-md text-label-md">On Time</span>
</div>
<!-- End Button -->
<button class="h-14 px-8 bg-error-container text-on-error-container border border-error/30 rounded-full font-headline-md text-headline-md shadow-md active:scale-95 transition-all flex items-center justify-center space-x-2" onclick="window.history.back()">
<span class="material-symbols-outlined">close</span>
<span>End</span>
</button>
</div>
<!-- Route Summary Bar -->
<div class="mt-8 h-2.5 w-full bg-surface-variant rounded-full flex overflow-hidden">
<div class="h-full bg-primary w-1/3 shadow-[inset_0_0_4px_rgba(0,0,0,0.2)]"></div>
<div class="h-full bg-error-rose w-1/12"></div>
<div class="h-full bg-primary w-full shadow-[inset_0_0_4px_rgba(0,0,0,0.2)]"></div>
</div>
</div>
</footer>
<!-- Micro-interaction overlay -->
<div class="fixed inset-0 bg-primary pointer-events-none opacity-0 z-50" id="instruction-flash"></div>
<script>
        // Simple animation to simulate progress
        let progress = 65;
        const progressBar = document.querySelector('.h-full.bg-primary');
        
        setInterval(() => {
            if (progress < 100) {
                progress += 0.05;
                if(progressBar) progressBar.style.width = `${progress}%`;
            }
        }, 1000);

        // Toggle zoom interaction
        const fabAdd = document.querySelector('.material-symbols-outlined[data-icon="add"]')?.parentElement;
        if(fabAdd) {
            fabAdd.onclick = () => {
                const map = document.querySelector('.perspective-map');
                if(map) map.style.transform = 'perspective(1000px) rotateX(45deg) scale(2)';
            }
        }
    </script>
</body></html>
