worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 16m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        location / { try_files $uri $uri/ /index.html; }
        location /internal/ { return 404; }
        location /api/ {
            proxy_pass http://boulder-backend:3001/api/;
            proxy_set_header Host boulder.lockdev.com;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        # PocketBase accepts collection IDs as aliases. Expose only the named
        # auth/config/profile APIs used by these clients, never arbitrary IDs,
        # batch/admin/file APIs or direct navigation/analytics collections.
        location ~ ^/pb/api/(collections/(users/(auth-methods|auth-with-password|auth-with-oauth2|auth-refresh|records)|(user_configs|route_tuning_profiles)/records)(/|$)|(health|realtime|oauth2-redirect)(/|$)) {
            rewrite ^/pb/(.*)$ /$1 break;
            proxy_pass http://pocketbase:8090;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host boulder.lockdev.com;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
        location /pb/ { return 404; }
    }
}
