server {
    listen 80;
    server_name localhost;

    # Serve the static frontend website
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the Flask container
    location /api/ {
        proxy_pass http://boulder-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Navigation data is only accessible through the Flask authorization layer.
    location ~ ^/pb/api/collections/(navigation_routes|navigation_ticks|place_search_events|route_analytics_events)(/|$) {
        return 404;
    }

    # Reverse proxy PocketBase requests used for authentication and user settings.
    location /pb/ {
        proxy_pass http://pocketbase:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
    }
}
